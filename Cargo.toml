[workspace]
resolver = "2"
members = [
    "crates/kaccy-core",
    "crates/kaccy-api",
    "crates/kaccy-bitcoin",
    "crates/kaccy-reputation",
    "crates/kaccy-ai",
    "crates/kaccy-db",
    "crates/kaccy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/cool-japan/kaccy"
authors = ["COOLJAPAN OU (Team KitaSan)"]
description = "Kaccy Protocol - Next-generation value distribution protocol for fractional Bitcoin transactions"
homepage = "https://github.com/cool-japan/kaccy"
documentation = "https://docs.rs/kaccy"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# WebSocket support
futures = "0.3"
tokio-stream = "0.1"

# HTTP body utilities
bytes = "1.11"
http-body-util = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "rust_decimal"] }

# Redis cache
redis = { version = "1.0", features = ["aio", "tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"

# Random number generation
rand = "0.9"
rand_distr = "0.5"
statrs = "0.18"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.40", features = ["serde"] }
rust_decimal_macros = "1.40"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
dashmap = "6"
parking_lot = "0.12"

# Bitcoin
bitcoin = "0.32"
bitcoincore-rpc = "0.19"
bip39 = { version = "2.2", features = ["rand"] }
secp256k1 = { version = "0.31", features = ["rand"] }

# Async traits
async-trait = "0.1"

# HTTP client for API calls
reqwest = { version = "0.13", features = ["json", "stream"] }
urlencoding = "2"

# PDF parsing
lopdf = "0.39"

# Image handling
image = "0.25"
base64 = "0.22"

# Regular expressions
regex = "1"

# Hex encoding
hex = "0.4"

# Base58 encoding
bs58 = "0.5"

# OpenAPI documentation
utoipa = { version = "5", features = ["uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# 2FA / TOTP support
totp-rs = { version = "5", features = ["qr", "otpauth"] }
qrcode = "0.14"

# Hashing and crypto
sha2 = "0.10"
md5 = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# Metrics
prometheus = { version = "0.14", features = ["process"] }
lazy_static = "1.5"

# OpenTelemetry and distributed tracing
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["tokio", "grpc-tonic"] }
opentelemetry-semantic-conventions = "0.31"
tracing-opentelemetry = "0.32"

# Testing
tokio-test = "0.4"
mockall = "0.14"
proptest = "1.9"
criterion = { version = "0.7", features = ["async_tokio"] }

# Internal crates
kaccy-core = { version = "0.1.0", path = "crates/kaccy-core" }
kaccy-api = { version = "0.1.0", path = "crates/kaccy-api" }
kaccy-bitcoin = { version = "0.1.0", path = "crates/kaccy-bitcoin" }
kaccy-reputation = { version = "0.1.0", path = "crates/kaccy-reputation" }
kaccy-ai = { version = "0.1.0", path = "crates/kaccy-ai" }
kaccy-db = { version = "0.1.0", path = "crates/kaccy-db" }
kaccy = { version = "0.1.0", path = "crates/kaccy" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
